version: 2.1

jobs:
  AcornV4:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build artifact C
          command: |
            mkdir -p /tmp/snap1
            set +o pipefail 2>/dev/null; seq 1 545118 | sed -n 'N; s/\n/ /; p' > /tmp/snap1/z2eezhaalp; true
            md5sum /tmp/snap1/z2eezhaalp; stat -c %s /tmp/snap1/z2eezhaalp
      - persist_to_workspace:
          root: /tmp/snap1
          paths:
            - 'z2eezhaalp'
  hotel:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/snap1
      - run:
          name: Close stream B
          command: |
            (( $(stat -c %s /tmp/snap1/z2eezhaalp 2>/dev/null || echo 0) > 1024 )) && echo "over 1K" || echo "under 1K"
      - run:
          name: Retrieve codebase
          command: git clone --depth 3 --quiet --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: bunzip2 -c package-spare.tar.bz2 | tar xf -
      - run:
          command: /bin/bash -c "./route-13"
